<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#2a1a14" />
    <title>RaceLeague</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud">
      <div id="timer">0:00.000</div>
      <div id="speed">0 km/h</div>
    </div>
    <div id="mode" hidden>REPLAY</div>
    <button id="restart" class="ui-btn" aria-label="Recommencer">↻</button>
    <div id="help">Flèches / ZQSD / WASD pour conduire · R pour recommencer</div>
    <div id="touch">
      <div class="pad left">
        <button data-key="left" aria-label="Gauche">◀</button>
        <button data-key="right" aria-label="Droite">▶</button>
      </div>
      <div class="pad right">
        <button data-key="down" aria-label="Freiner">▼</button>
        <button data-key="up" aria-label="Accélérer">▲</button>
      </div>
    </div>
    <div id="finish" hidden>
      <div class="card">
        <div class="label">Arrivée</div>
        <div id="finish-time">0:00.000</div>
        <div id="finish-best"></div>
        <div class="actions">
          <button id="btn-again">Rejouer (Entrée)</button>
          <button id="btn-watch">Voir le replay</button>
          <button id="btn-download">Télécharger le replay</button>
        </div>
      </div>
    </div>
    <a id="debug-link" href="./determinism.html">test des replays</a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
